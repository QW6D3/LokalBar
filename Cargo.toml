[package]
name = "project"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.7.9", features = ["ws"] } # <-- "ws" est CRUCIAL ici
tokio = { version = "1.0", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3" # <-- Ajoute cette ligne si elle manque
tower-http = { version = "0.6.8", features = ["cors"] }
